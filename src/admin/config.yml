          - { label: "Banner Image", name: "bannerImage", widget: "image" }
          - label: "Banner Height"
            name: "bannerHeight"
            widget: "select"
            options:
              - { label: "Short (200px)", value: "short" }
              - { label: "Medium (300px)", value: "medium" }
              - { label: "Tall (400px)", value: "tall" }
              - { label: "Extra Tall (500px)", value: "xtall" }
              - { label: "HD 720p (720px)", value: "hd" }
              - { label: "Full HD 1080p (1080px)", value: "xxtall" }
            default: "medium"
            hint: "Choose banner height based on your image. Tall/portrait images look better with Tall or Extra Tall."
            required: false
          - label: "Banner Focus"
            name: "bannerFocus"
            widget: "select"
            options:
              - { label: "Center", value: "center" }
              - { label: "Center-Top (between center and top)", value: "center-top" }
              - { label: "Top (faces/heads at top)", value: "top" }
              - { label: "Center-Bottom (between center and bottom)", value: "center-bottom" }
              - { label: "Bottom", value: "bottom" }
            default: "center"
            hint: "Which part of the image should stay visible when the banner is cropped"
            required: false
          - { label: "Show Sidebar", name: "sidebar", widget: "boolean", default: true }
          - label: "Sidebar Info"
            name: "sidebarInfo"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Value", name: "value", widget: "string" }
          - label: "Sidebar Call to Action"
            name: "sidebarCta"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Primary Button", name: "primaryButton", widget: "string" }
              - { label: "Secondary Button", name: "secondaryButton", widget: "string" }
          - label: "Gallery"
            name: "gallery"
            widget: "list"
            required: false
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
              - { label: "Caption", name: "caption", widget: "string", required: false, hint: "Optional caption displayed below the image in the lightbox viewer" }
          - label: "Gallery Display Ratio"
            name: "galleryRatio"
            widget: "select"
            options:
              - { label: "Square (1:1)", value: "square" }
              - { label: "Landscape (4:3)", value: "4/3" }
              - { label: "Wide (3:2)", value: "3/2" }
              - { label: "Widescreen (16:9)", value: "16/9" }
              - { label: "Portrait (3:4)", value: "3/4" }
              - { label: "Auto (original size)", value: "auto" }
            default: "square"
            hint: "How gallery thumbnails are cropped. Use Auto to show original proportions."
            required: false
          - { label: "URL Path", name: "permalink", widget: "string" }
          - { label: "Body Content", name: "body", widget: "markdown" }

      - name: "vision-mission"
        label: "Vision & Mission"

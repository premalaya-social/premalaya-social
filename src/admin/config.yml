# Use DecapBridge PKCE auth
backend:
  name: git-gateway
  repo: premalaya-social/premalaya-social
  branch: develop
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/f084722a-4b8e-4613-ab05-e7056d31583c/pkce
  auth_token_endpoint: /sites/f084722a-4b8e-4613-ab05-e7056d31583c/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Media files will be stored in src/img/uploads
media_folder: "src/img/uploads"
public_folder: "/img/uploads"

site_url: https://www.premalayasocial.in
display_url: https://www.premalayasocial.in

collections:
  # ===========================
  # SITE SETTINGS
  # ===========================
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "site"
        label: "Site Information"
        file: "src/_data/site.json"
        fields:
          - { label: "Site Name", name: "name", widget: "string" }
          - { label: "Short Name", name: "shortName", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "URL", name: "url", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Contact Email", name: "contactEmail", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Facebook URL", name: "facebook", widget: "string" }
          - { label: "Google Maps Embed URL", name: "mapEmbedUrl", widget: "string" }
          - { label: "Copyright Text", name: "copyright", widget: "string" }
          - { label: "Powered By Text", name: "poweredBy", widget: "string" }
          - { label: "Powered By URL", name: "poweredByUrl", widget: "string" }

  # ===========================
  # HOMEPAGE
  # ===========================
  - name: "homepage"
    label: "Homepage"
    files:
      - name: "home"
        label: "Homepage Content"
        file: "src/index.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/home.njk" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - label: "Hero Slides"
            name: "heroSlides"
            widget: "list"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
              - label: "Image Focus"
                name: "imageFocus"
                widget: "select"
                options: ["center", "top", "bottom", "left", "right"]
                default: "center"
                hint: "Which part of the image should stay visible when cropped"
                required: false
              - { label: "Link", name: "link", widget: "string" }
              - { label: "Badge Text", name: "badge", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Sub Text", name: "subtext", widget: "string" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Color", name: "buttonColor", widget: "select", options: ["primary", "secondary", "purple", "green", "red"] }
          - label: "About Cards"
            name: "aboutCards"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
              - label: "Image Focus"
                name: "imageFocus"
                widget: "select"
                options: ["center", "top", "bottom"]
                default: "center"
                hint: "Which part of the image to focus on in the card thumbnail"
                required: false
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Link", name: "link", widget: "string" }
          - label: "Project Cards"
            name: "projectCards"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
              - label: "Image Focus"
                name: "imageFocus"
                widget: "select"
                options: ["center", "top", "bottom"]
                default: "center"
                hint: "Which part of the image to focus on in the card thumbnail"
                required: false
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Link", name: "link", widget: "string" }
          - label: "Impact Stats"
            name: "impactStats"
            widget: "list"
            required: false
            hint: "Large counter numbers shown in the stats section (e.g. '6+', '1000+', '2'). Leave empty to show default icons instead."
            summary: "{{fields.number}} - {{fields.label}}"
            fields:
              - { label: "Number", name: "number", widget: "string", hint: "The big number to display (e.g. '6+', '1000+', '30+')" }
              - { label: "Label", name: "label", widget: "string", hint: "Short description below the number (e.g. 'Programs', 'Lives Impacted')" }
          - label: "Trust Points"
            name: "trustPoints"
            widget: "list"
            required: false
            hint: "Trust badges shown in the blue section (e.g. 'Registered Society', '80G Tax Exemption'). Leave empty to show defaults."
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Icon CSS Class", name: "icon", widget: "string", required: false, hint: "Font Awesome class (e.g. 'fa-solid fa-building-columns'). Leave blank for default checkmark." }

  # ===========================
  # ABOUT PAGES
  # ===========================
  - name: "about_pages"
    label: "About Us Pages"
    files:
      - name: "about"
        label: "About Premalaya"
        file: "src/about.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/page.njk" }
          - { label: "Title", name: "title", widget: "string" }

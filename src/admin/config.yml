          - label: "Banner Focus"
            name: "bannerFocus"
            widget: "select"
            options:
              - { label: "Center", value: "center" }
              - { label: "Center-Top (between center and top)", value: "center-top" }
              - { label: "Top (faces/heads at top)", value: "top" }
              - { label: "Center-Bottom (between center and bottom)", value: "center-bottom" }
